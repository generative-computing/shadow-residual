namespace: security

jobName: &jobName antonp-sr-qo-mlp-r32-c32-sharedkv-30b-ans
queueName: default-queue
priority: default-priority

numPods: &numPodsVal 1
numCpusPerPod: 8
numGpusPerPod: &gpusPerPod 4
totalMemoryPerPod: 400Gi

containerImage: us.icr.io/cil15-shared-registry/sec-rl-neo:latest

sshGitCloneConfig:
  secretName: github-ssh-key
  configMapName: github-known-hosts

retryLimit: 1
deletionOnFailureGracePeriodDuration: 24h
failureGracePeriodDuration: 24h

environmentVariables:
  - name: NUM_PODS
    value: *numPodsVal
  - name: GPUS_PER_POD
    value: *gpusPerPod
  - name: JOB_NAME
    value: *jobName
  - name: HF_TOKEN
    secret:
      name: antonp-hf-token
      key: token
  - name: HF_DATASETS_TRUST_REMOTE_CODE
    value: "1"
  - name: HF_HOME
    value: /workspace/.cache/huggingface
  - name: TORCH_HOME
    value: /workspace/.cache/torch
  - name: XDG_CACHE_HOME
    value: /workspace/.cache
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: PYTORCH_CUDA_ALLOC_CONF
    value: "expandable_segments:True"
  - name: GHP_PERSONAL_TOKEN
    secret:
      name: antonp-ghp-token
      key: token
  - name: REPO_BRANCH
    value: feature/sr-30b-fsdp-meta
  - name: WANDB_BASE_URL
    value: http://52.116.188.209:7689/
  - name: WANDB_API_KEY
    secret:
      name: antonp-wandb-api-key
      key: key
  - name: WANDB_PROJECT
    value: shadow-residual
  - name: WANDB_RUN_NAME
    value: sr-qo-mlp-r32-c32-sharedkv-30b-answerability
  - name: TRAIN_CONFIG
    # TODO: point at a 30B config (set model.base to the 30B model + param_dtype
    # / batch sizing). The shipped reference configs target granite-4.1-3b; copy
    # sr-qo-mlp-r32-c32-sharedkv.yaml and bump the base model for 30B FSDP.
    value: src/shadow_residual/config/sr-qo-mlp-r32-c32-sharedkv.yaml
  - name: VARIANT
    value: sr-qo-mlp-r32-c32-sharedkv-30b-answerability
  - name: EVALUATION_SCRIPT
    value: scripts/score_answerability_predictions.py
  - name: DATA_ROOT
    value: <YOUR_DATA_ROOT>
  - name: EVAL_DATA
    value: <YOUR_EVAL_DATA>
  - name: OUTPUT_BASE
    value: <YOUR_OUTPUT_BASE>

imagePullSecrets:
  - name: image-pull-secret-us

volumes:
  - name: danieloh-cos
    claimName: danieloh-cos
    mountPath: /danieloh_cos

setupCommands:
  - nvidia-smi
  - export RUN_TS=$(date -u +%Y%m%dT%H%M%SZ)
  - echo "Run timestamp ${RUN_TS}, variant ${VARIANT}"
  - git clone https://${GHP_PERSONAL_TOKEN}@<YOUR_GIT_HOST>/<ORG>/shadow-residual.git   # TODO: set the shadow-residual remote
  - cd shadow-residual
  - git checkout ${REPO_BRANCH}
  - python3 -m venv .venv
  - . .venv/bin/activate
  - pip install --upgrade pip
  - pip install -e ".[train]"
  - pip uninstall -y torchvision || true
  - pip install --force-reinstall --index-url https://download.pytorch.org/whl/cu124 "torch==2.6.0"
  - python3 -c "import torch, transformers, peft, trl; print('torch', torch.__version__, 'cuda', torch.version.cuda); print('transformers', transformers.__version__); print('peft', peft.__version__); print('trl', trl.__version__); print('cuda_available', torch.cuda.is_available(), 'devices', torch.cuda.device_count())"
  - ls -la ${DATA_ROOT}/train.jsonl ${DATA_ROOT}/val.jsonl
  - wc -l ${DATA_ROOT}/train.jsonl ${DATA_ROOT}/val.jsonl
  - export RUN_DIR=${OUTPUT_BASE}/${VARIANT}/run_${RUN_TS}
  - mkdir -p ${RUN_DIR}
  - 'echo "Run dir = ${RUN_DIR}"'
  - echo "=== Train config ===" && cat ${TRAIN_CONFIG}
  - echo "=== Training (1 GPU, variant ${VARIANT}) ==="
  - echo "=== FSDP accelerate config ===" && cat src/shadow_residual/config/accelerate/fsdp_4gpu.yaml
  - accelerate launch --config_file src/shadow_residual/config/accelerate/fsdp_4gpu.yaml --main_process_port 0 -m shadow_residual.training.train --config ${TRAIN_CONFIG} --debug-collator --skip-post-train-generate
  - echo "============================================================"
  - echo "=== Generation (separate process, single GPU, clean CUDA context) ==="
  - echo "============================================================"
  - "CUDA_VISIBLE_DEVICES=0 python3 -m shadow_residual.training.generate --config ${TRAIN_CONFIG} --checkpoint ${RUN_DIR}/checkpoints --data ${EVAL_DATA} --out ${RUN_DIR}/checkpoints/predictions.jsonl"
  - echo "============================================================"
  - echo "=== Running evaluation ==="
  - echo "============================================================"
  - "python3 ${EVALUATION_SCRIPT} --predictions ${RUN_DIR}/checkpoints/predictions.jsonl"
  - echo "=== work done; sleeping 1800s ==="
  - sleep 1800

mainProgram:
