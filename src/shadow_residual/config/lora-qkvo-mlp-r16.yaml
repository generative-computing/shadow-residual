# Auto-generated by scratch/generate_sweep.py — do not hand-edit.
# Sweep slug: lora-qkvo-mlp-r16
# Arch: lora

# yaml-language-server: $schema=./schema/training_config.schema.json

model:
  base: ibm-granite/granite-4.1-3b

data:
  train_path: ${DATA_ROOT}/train.jsonl
  val_path:   ${DATA_ROOT}/val.jsonl
  max_length: 4096

adapter:
  target_modules:
    q_proj: 16
    k_proj: 16
    v_proj: 16
    o_proj: 16
    gate_proj: 16
    up_proj: 16
    down_proj: 16
  alpha: 32
  dropout: 0.05
  # invocation_tokens left null → unconditional adapter

optimizer:
  name: adamw_torch
  learning_rate: 2.0e-4
  weight_decay: 0.01

scheduler:
  type: cosine
  warmup_ratio: 0.05

batch:
  per_device_train: 2
  gradient_accumulation: 4           # 1 GPU * 1 * 32 = effective batch 32
  per_device_eval: 1
  gradient_checkpointing: true

validation:
  strategy: epoch
  load_best_model_at_end: false
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 3
  stop_on_nan: true

save:
  strategy: epoch
  total_limit: 3
  output_dir: ${RUN_DIR}/checkpoints

runtime:
  num_train_epochs: 2
  seed: 2
  logging_steps: 1
  dataloader_num_workers: 4
  report_to: [wandb]

generation:
  input_path: ${EVAL_DATA}
  max_new_tokens: 200
  do_sample: false
  batch_size: 16
  output_filename: predictions.jsonl
