# SR r16, early-stopping variant for the convergence-controlled low-W-cross-LR run.
#
# Same adapter as sr-qo-r16 (SR, cross live). Differences:
#  - val_path points at a 10%-of-train held-out split (${EARLYSTOP_VAL}) used ONLY
#    for the per-epoch early-stopping signal (eval_loss). The ORIGINAL held-out
#    val/test (${EVAL_DATA}) is reserved for final canonical scoring via the
#    generation: block, so early-stopping never peeks at the reported metric.
#  - load_best_model_at_end=true + early_stopping_patience=1 + eval each epoch:
#    train up to 6 epochs, stop 1 epoch after eval_loss stops improving, and SAVE
#    THE BEST (lowest eval_loss) checkpoint — the converged-best SR, not final-epoch.
#  - W-cross LR is set GENTLE via the CLI --cross-lr 2e-5 (q/o stay at 2e-4).

model:
  base: ibm-granite/granite-4.1-3b

data:
  train_path: ${DATA_ROOT}/train_90.jsonl   # 90% split (prep step writes this)
  val_path:   ${EARLYSTOP_VAL}              # 10% held-out from train
  max_length: 4096

adapter:
  target_modules:
    q_proj: 16
    o_proj: 16
    cross_stream: 16
  alpha: 64
  dropout: 0.05
  last_context_token: "<|end_of_role|>"
  last_token: "<|end_of_text|>"

optimizer:
  name: adamw_torch
  learning_rate: 2.0e-4
  weight_decay: 0.01

scheduler:
  type: cosine
  warmup_ratio: 0.05

batch:
  per_device_train: 2
  gradient_accumulation: 4
  per_device_eval: 1
  gradient_checkpointing: true

validation:
  strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 1
  stop_on_nan: true

save:
  strategy: epoch
  total_limit: 2            # keep best + last so load_best_model_at_end works
  output_dir: ${RUN_DIR}/checkpoints

runtime:
  num_train_epochs: 6
  seed: 2
  logging_steps: 1
  dataloader_num_workers: 4
  report_to: [tensorboard]

generation:
  input_path: ${EVAL_DATA}  # ORIGINAL held-out val/test for final canonical scoring
  max_new_tokens: 200
  do_sample: false
  batch_size: 16
  output_filename: predictions.jsonl
